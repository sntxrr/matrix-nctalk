# The shared secret from `occ talk:bot:install`.
#
# Install the bot on the Nextcloud server with:
#   occ talk:bot:install "Matrix Bridge" <secret> \
#       "https://bridge.example.com/_nctalk/webhook" \
#       --feature webhook --feature response --feature reaction
#
# Do NOT pass --no-setup: that installs the bot in the "no setup" state, which
# prevents the bridge from enabling itself in individual conversations.
bot_secret: ""

# Bridges serving more than one Nextcloud server need a secret per server, set
# here instead of above. Install the bot separately on each, with its own
# secret, and key them by hostname.
#
# This is not optional for multi-server setups. The header naming the sending
# server is not covered by the webhook signature, so a secret shared between
# servers lets any of them — or anyone who captures one signed request — forge
# events for the others. Choosing the secret by hostname is what makes the
# claimed sender verifiable.
#
# Setting this disables bot_secret entirely: a host with no entry here is
# refused rather than falling back to it.
bot_secrets: {}
#   cloud-a.example.com: "..."
#   cloud-b.example.com: "..."

# The display name the bot was installed with. The bridge uses this to find its
# own bot ID in a conversation's bot list, so it must match the name above.
bot_name: Matrix Bridge

# Automatically enable the bot in conversations where the logged-in Nextcloud
# user is a moderator. Conversations where they are not a moderator need a
# moderator to enable the bot manually, or `occ talk:bot:setup <botId> <token>`.
auto_enable_bot: true

# Nextcloud servers users are allowed to log into, as bare hostnames.
# Leave empty to allow any public server.
#
# This list also marks internal servers as intentional. Logging in makes the
# bridge fetch a URL the user chose, so an address on a loopback, private or
# link-local network is refused unless it is named here — otherwise anyone
# permitted to use the bridge could aim it at the network it runs in. Naming a
# host here says you meant it; it does not open the rest of that network.
allowed_servers: []

# Relay messages from Matrix users who have not linked a Nextcloud account.
# When true, their messages are posted by the bot prefixed with their name.
# When false, they are rejected with an error so nothing is silently misattributed.
# Relayed messages are second-class: Talk's bot endpoint does not report the ID it
# assigned them, so they cannot later be edited, deleted, or replied to from
# Matrix. A portal also needs a relay login set before this takes effect.
relay_unlinked_users: false

# Key used to encrypt the Nextcloud app passwords the bridge stores in its
# database. Left as "generate", a new one is created on first run and written
# back here, so credentials are never at rest in the clear.
#
# Back this up with the database and keep the two together. Losing it does not
# expose anything, but every user has to log in again. Changing it has the same
# effect.
#
# What this protects against is the database turning up somewhere on its own —
# a backup, a dump, a replica, a copied volume. It is not protection against
# someone who already has this file: for that, keep the key out of the config
# entirely by setting env_config_prefix above and passing the value in the
# environment, or in a file with the _FILE suffix. See the README.
credential_key: generate

# How long to wait for the user to approve a Login Flow v2 request in their
# browser. Nextcloud expires the handshake after 20 minutes.
login_timeout: 15m

# How often to resync bridged conversations: room name, topic, avatar and member
# list, plus any messages Talk delivered while the bridge was not running. Talk
# retries no webhook, so this is the only thing that recovers those. A pass also
# runs immediately whenever a login connects.
#
# Catching up on missed messages additionally needs `backfill.enabled: true`
# above. Set to a negative value to turn the resync off entirely.
sync_interval: 1h
